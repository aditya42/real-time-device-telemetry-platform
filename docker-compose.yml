name: device-telemetry-platform

services:
  kafka:
    image: confluentinc/cp-kafka:7.7.12
    hostname: kafka
    container_name: telemetry-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [telemetry]

  kafka-init:
    image: confluentinc/cp-kafka:7.7.12
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/bash", "-ec" ]
    command: |
      echo "Waiting for Kafka..."

      until kafka-topics --bootstrap-server kafka:9092 --list; do
        echo "Kafka not ready..."
        sleep 5
      done

      for topic in telemetry.health telemetry.usage telemetry.error; do
        echo "Creating topic: $$topic"
        kafka-topics \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic "$$topic" \
          --partitions 6 \
          --replication-factor 1
      done

      echo "Kafka initialization completed."
    restart: "no"

  postgres:
    image: postgres:16-alpine
    container_name: telemetry-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telemetry}
      POSTGRES_USER: ${POSTGRES_USER:-telemetry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telemetry}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telemetry} -d ${POSTGRES_DB:-telemetry}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [telemetry]

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: telemetry-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    networks: [telemetry]

  minio-init:
    build: ./minio-init
    depends_on:
      minio:
        condition: service_started
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-telemetry-lake}
    networks: [telemetry]

  generator:
    build: ./generator
    container_name: telemetry-generator
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DEVICE_COUNT: ${DEVICE_COUNT:-10000}
      EVENTS_PER_SECOND: ${EVENTS_PER_SECOND:-500}
      REGRESSION_FIRMWARE_VERSION: ${REGRESSION_FIRMWARE_VERSION:-2.3.0}
      REGRESSION_ERROR_MULTIPLIER: ${REGRESSION_ERROR_MULTIPLIER:-6.0}
      REGRESSION_LATENCY_MULTIPLIER_GENERATOR: ${REGRESSION_LATENCY_MULTIPLIER_GENERATOR:-1.8}
    restart: unless-stopped
    networks: [telemetry]

  spark-streaming:
    build: ./streaming
    container_name: telemetry-spark
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-telemetry}
      POSTGRES_USER: ${POSTGRES_USER:-telemetry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telemetry}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-telemetry-lake}
      SPARK_CHECKPOINT_LOCATION: /checkpoints/telemetry
      REGRESSION_MIN_EVENTS: ${REGRESSION_MIN_EVENTS:-50}
      REGRESSION_FAILURE_MULTIPLIER: ${REGRESSION_FAILURE_MULTIPLIER:-2.0}
      REGRESSION_FAILURE_ABS_THRESHOLD: ${REGRESSION_FAILURE_ABS_THRESHOLD:-0.05}
      REGRESSION_LATENCY_MULTIPLIER: ${REGRESSION_LATENCY_MULTIPLIER:-1.5}
    volumes:
      - spark_checkpoints:/checkpoints
    restart: unless-stopped
    networks: [telemetry]

  metrics-api:
    build: ./metrics-api
    container_name: telemetry-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-telemetry}
      POSTGRES_USER: ${POSTGRES_USER:-telemetry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telemetry}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [telemetry]

  grafana:
    image: grafana/grafana:11.3.1
    container_name: telemetry-grafana
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      POSTGRES_DB: ${POSTGRES_DB:-telemetry}
      POSTGRES_USER: ${POSTGRES_USER:-telemetry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telemetry}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [telemetry]

networks:
  telemetry:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  grafana_data:
  spark_checkpoints:
